name: Layer build dependencies
description: >-
  The pinned vcpkg registry and its OpenXR loader, and the archives the layer's CMake downloads
  (Vulkan headers, DXC), cached between runs. GitHub's release downloads sometimes answer 5xx for
  a while, so a cache hit downloads nothing, and every download that is still needed is retried.

runs:
  using: composite
  steps:
    - name: Checkout pinned vcpkg registry
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: microsoft/vcpkg
        ref: aae277acf4e7de287ddb5e208b5316614de6aad7
        path: .vcpkg
        persist-credentials: false

    # After the registry's checkout, which would clear these.
    - name: Cache vcpkg tool and OpenXR loader
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .vcpkg/vcpkg.exe
          .vcpkg/installed
        key: openxr-loader-v1-${{ runner.os }}-aae277acf4e7de287ddb5e208b5316614de6aad7

    - name: Cache layer downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .downloads
        key: layer-downloads-v1-${{ runner.os }}-${{ hashFiles('layer/CMakeLists.txt') }}
        restore-keys: |
          layer-downloads-v1-${{ runner.os }}-

    - name: Install OpenXR loader
      shell: pwsh
      run: |
        $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE ".vcpkg"
        # Each download is tried a few times before failing.
        function Invoke-WithRetry([string]$What, [int]$Attempts, [scriptblock]$Step) {
          for ($attempt = 1; $attempt -le $Attempts; $attempt++) {
            & $Step | Out-Host
            if ($LASTEXITCODE -eq 0) { return $true }
            if ($attempt -lt $Attempts) {
              $delay = 20 * $attempt
              Write-Host "$What failed (attempt $attempt of $Attempts); retrying in $delay s."
              Start-Sleep -Seconds $delay
            }
          }
          return $false
        }

        $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
        if (Test-Path $vcpkgExe) {
          Write-Host "Using the cached vcpkg tool."
        } else {
          $bootstrapped = Invoke-WithRetry "Bootstrapping the pinned vcpkg registry" 3 {
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          }
          if (-not $bootstrapped) {
            # The runner image ships a vcpkg tool: use it with the pinned
            # registry rather than fail on the tool's download.
            $preinstalled = if ($env:VCPKG_INSTALLATION_ROOT) { Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe" }
            if (-not $preinstalled -or -not (Test-Path $preinstalled)) {
              throw "Failed to bootstrap the pinned vcpkg registry, and the runner has no vcpkg tool to fall back on."
            }
            Write-Host "Using the runner's vcpkg tool ($preinstalled) with the pinned registry."
            Copy-Item -LiteralPath $preinstalled -Destination $vcpkgExe -Force
          }
        }

        "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $env:VCPKG_ROOT = $vcpkgRoot
        # Already installed (a cache hit), this only checks the package.
        $installed = Invoke-WithRetry "Installing the pinned OpenXR loader dependency" 5 {
          & $vcpkgExe install openxr-loader:x64-windows
        }
        if (-not $installed) {
          throw "Failed to install the pinned OpenXR loader dependency."
        }

        # layer/CMakeLists.txt keeps its pinned archives here (and retries their downloads).
        "DEPTHXR_DOWNLOAD_CACHE=$(Join-Path $env:GITHUB_WORKSPACE '.downloads')" |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
