name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# The layer's tests split across two runners that run at once: those that create no graphics device (beside
# the app's checks) and those that do, which run one at a time on WARP. "App tests and build", the check the
# master ruleset requires, passes only when both do.
jobs:
  app:
    name: App and layer CPU tests
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.1

      - name: Layer build dependencies
        uses: ./.github/actions/layer-dependencies

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Test app model
        working-directory: app
        run: npm test

      - name: Build app frontend
        working-directory: app
        run: npm run build

      - name: Build OpenXR layer and run its CPU tests
        shell: pwsh
        run: |
          ./scripts/Build-Layer.ps1 -Tests Cpu
          ./scripts/Stage-ReleasePayload.ps1

      - name: Check Tauri app
        working-directory: app/src-tauri
        run: cargo check --locked

  layer-graphics:
    name: Layer graphics tests
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Layer build dependencies
        uses: ./.github/actions/layer-dependencies

      - name: Build OpenXR layer and run its graphics tests
        shell: pwsh
        run: ./scripts/Build-Layer.ps1 -Tests Graphics

      # The bridge layer tests keep each case's layer log under %TEMP%; a
      # failing timing check needs it to be told apart from a slow runner.
      - name: Upload layer test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layer-graphics-test-logs
          path: ~/AppData/Local/Temp/vectorxr-*/logs/
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: App tests and build
    needs: [app, layer-graphics]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Both halves passed
        env:
          APP: ${{ needs.app.result }}
          GRAPHICS: ${{ needs.layer-graphics.result }}
        run: |
          echo "App and layer CPU tests: $APP; layer graphics tests: $GRAPHICS"
          test "$APP" = success && test "$GRAPHICS" = success
