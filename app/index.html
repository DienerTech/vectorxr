<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VectorXR</title>
    <script>
      // Before the first paint: the stored theme, so the
      // window does not open in the other palette while the app loads. Keep
      // the keys and rules in step with src/lib/theme.ts.
      (function () {
        try {
          var root = document.documentElement
          var stored = window.localStorage.getItem('vectorxr-theme-preference')
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark = preference === 'system'
            ? typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches
            : preference === 'dark'
          root.dataset.theme = dark ? 'dark' : 'light'
          root.dataset.themePreference = preference
        } catch (error) {
          // No storage: the app applies the defaults when it starts.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  </html>
